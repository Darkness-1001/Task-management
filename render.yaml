services:
  - type: web
    name: taskflow-node-postgres
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm ci
    startCommand: npm run db:init && npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: taskflow-postgres
          property: connectionString

databases:
  - name: taskflow-postgres
    databaseName: task_management
    user: taskflow_user
    region: singapore
    plan: free
    postgresMajorVersion: "18"
